# Default values for SkyOps self-hosted deployment.
# Single Helm installation provisions PostgreSQL database, SkyOps API & Web UI, and SkyOps Agent.

global:
  environment: "production"

# Optional image pull secrets for private container registries
imagePullSecrets: []

# SkyOps Agent configuration
agent:
  enabled: true
  image:
    repository: dhandesaurav52/skyops-agent
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  token: "skyops-agent-secret-token"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# SkyOps API & Web UI Server configuration
api:
  image:
    repository: dhandesaurav52/skyops-api
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  service:
    type: NodePort
    port: 8000
    nodePort: 30800
  adminUsername: "admin"
  adminPassword: "skyops123"
  secretKey: "skyops-secret-key-change-in-production"
  nodeSelector: {}
  tolerations: []
  affinity: {}

# PostgreSQL Database configuration
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  host: ""
  auth:
    database: skyops
    username: skyops
    password: "skyops-pg-password"
  persistence:
    enabled: true
    mountPath: /var/lib/postgresql/data
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# External database override (if postgresql.enabled is false)
externalDatabase:
  url: ""

gemini:
  apiKey: ""

# Optional existing Kubernetes Secret containing SKYOPS_AGENT_TOKEN, POSTGRES_PASSWORD, etc.
existingSecret: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

rbac:
  create: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: skyops.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
