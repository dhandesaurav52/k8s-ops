# SkyOps Agent Helm Chart Values
# Customers install ONLY the SkyOps Agent in their Kubernetes cluster.
# The agent connects outbound to the SkyOps Cloud platform.

server:
  url: "https://api.skyops.io"

cluster:
  name: "production-eks"

agent:
  token: ""
  image:
    repository: dhandesaurav52/skyops-agent
    pullPolicy: IfNotPresent
    tag: "1.0.0"
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  affinity: {}

imagePullSecrets: []
existingSecret: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

rbac:
  create: true

serviceAccount:
  create: true
  annotations: {}
  name: ""

probes:
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
