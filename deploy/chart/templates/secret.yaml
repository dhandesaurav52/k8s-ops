{{- if not .Values.existingSecret -}}
{{- $secretName := include "skyops.secretName" . -}}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace $secretName) -}}
{{- $existingData := dict -}}
{{- if $existingSecret -}}
  {{- if hasKey $existingSecret "data" -}}
    {{- $existingData = $existingSecret.data -}}
  {{- end -}}
{{- end -}}

{{- $initialAdminPasswordB64 := "" -}}
{{- if .Values.api.initialAdminPassword -}}
  {{- $initialAdminPasswordB64 = .Values.api.initialAdminPassword | b64enc -}}
{{- else if .Values.api.adminPassword -}}
  {{- $initialAdminPasswordB64 = .Values.api.adminPassword | b64enc -}}
{{- else if hasKey $existingData "SKYOPS_INITIAL_ADMIN_PASSWORD" -}}
  {{- $initialAdminPasswordB64 = index $existingData "SKYOPS_INITIAL_ADMIN_PASSWORD" -}}
{{- else if hasKey $existingData "SKYOPS_ADMIN_PASSWORD" -}}
  {{- $initialAdminPasswordB64 = index $existingData "SKYOPS_ADMIN_PASSWORD" -}}
{{- else if hasKey $existingData "initial-admin-password" -}}
  {{- $initialAdminPasswordB64 = index $existingData "initial-admin-password" -}}
{{- else -}}
  {{- $initialAdminPasswordB64 = randAlphaNum 32 | b64enc -}}
{{- end -}}

{{- $secretKeyB64 := "" -}}
{{- if .Values.api.secretKey -}}
  {{- $secretKeyB64 = .Values.api.secretKey | b64enc -}}
{{- else if hasKey $existingData "SKYOPS_SECRET_KEY" -}}
  {{- $secretKeyB64 = index $existingData "SKYOPS_SECRET_KEY" -}}
{{- else -}}
  {{- $secretKeyB64 = randAlphaNum 32 | b64enc -}}
{{- end -}}

{{- $agentTokenB64 := "" -}}
{{- if .Values.agent.token -}}
  {{- $agentTokenB64 = .Values.agent.token | b64enc -}}
{{- else if hasKey $existingData "SKYOPS_AGENT_TOKEN" -}}
  {{- $agentTokenB64 = index $existingData "SKYOPS_AGENT_TOKEN" -}}
{{- else -}}
  {{- $agentTokenB64 = randAlphaNum 32 | b64enc -}}
{{- end -}}

{{- $postgresPasswordB64 := "" -}}
{{- if .Values.postgresql.auth.password -}}
  {{- $postgresPasswordB64 = .Values.postgresql.auth.password | b64enc -}}
{{- else if hasKey $existingData "POSTGRES_PASSWORD" -}}
  {{- $postgresPasswordB64 = index $existingData "POSTGRES_PASSWORD" -}}
{{- else -}}
  {{- $postgresPasswordB64 = randAlphaNum 32 | b64enc -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
type: Opaque
data:
  SKYOPS_AGENT_TOKEN: {{ $agentTokenB64 | quote }}
  POSTGRES_USER: {{ default "skyops" .Values.postgresql.auth.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ $postgresPasswordB64 | quote }}
  POSTGRES_DB: {{ default "skyops" .Values.postgresql.auth.database | b64enc | quote }}
  SKYOPS_ADMIN_USERNAME: {{ default "admin" .Values.api.adminUsername | b64enc | quote }}
  SKYOPS_ADMIN_PASSWORD: {{ $initialAdminPasswordB64 | quote }}
  SKYOPS_INITIAL_ADMIN_PASSWORD: {{ $initialAdminPasswordB64 | quote }}
  initial-admin-password: {{ $initialAdminPasswordB64 | quote }}
  SKYOPS_SECRET_KEY: {{ $secretKeyB64 | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s:5432/%s" (default "skyops" .Values.postgresql.auth.username) ($postgresPasswordB64 | b64dec) (include "skyops.postgresql.host" .) (default "skyops" .Values.postgresql.auth.database) | b64enc | quote }}
  {{- if .Values.gemini.apiKey }}
  GEMINI_API_KEY: {{ .Values.gemini.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
