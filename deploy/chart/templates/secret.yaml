{{- if not .Values.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skyops.secretName" . }}
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
type: Opaque
data:
  SKYOPS_AGENT_TOKEN: {{ default "skyops-agent-secret-token" .Values.agent.token | b64enc | quote }}
  POSTGRES_USER: {{ default "skyops" .Values.postgresql.auth.username | b64enc | quote }}
  POSTGRES_PASSWORD: {{ default "skyops-pg-password" .Values.postgresql.auth.password | b64enc | quote }}
  POSTGRES_DB: {{ default "skyops" .Values.postgresql.auth.database | b64enc | quote }}
  SKYOPS_ADMIN_USERNAME: {{ default "admin" .Values.api.adminUsername | b64enc | quote }}
  SKYOPS_ADMIN_PASSWORD: {{ default "skyops123" .Values.api.adminPassword | b64enc | quote }}
  SKYOPS_INITIAL_ADMIN_PASSWORD: {{ default "skyops-initial-admin-password" .Values.api.initialAdminPassword | default .Values.api.adminPassword | b64enc | quote }}
  initial-admin-password: {{ default "skyops-initial-admin-password" .Values.api.initialAdminPassword | default .Values.api.adminPassword | b64enc | quote }}
  SKYOPS_SECRET_KEY: {{ default "skyops-secret-key-change-in-production" .Values.api.secretKey | b64enc | quote }}
  {{- if .Values.gemini.apiKey }}
  GEMINI_API_KEY: {{ .Values.gemini.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
