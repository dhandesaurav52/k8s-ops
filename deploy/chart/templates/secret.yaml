{{- if and (not .Values.existingSecret) (or .Values.agent.token .Values.gemini.apiKey) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "skyops.fullname" . }}-secrets
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.agent.token }}
  SKYOPS_AGENT_TOKEN: {{ .Values.agent.token | b64enc | quote }}
  {{- end }}
  {{- if .Values.gemini.apiKey }}
  GEMINI_API_KEY: {{ .Values.gemini.apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
