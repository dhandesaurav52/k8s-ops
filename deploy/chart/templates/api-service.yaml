apiVersion: v1
kind: Service
metadata:
  name: {{ include "skyops.fullname" . }}-api
  labels:
    app.kubernetes.io/component: api
    {{- include "skyops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type | default "NodePort" }}
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.api.service.type "NodePort") .Values.api.service.nodePort }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
  selector:
    app.kubernetes.io/component: api
    {{- include "skyops.selectorLabels" . | nindent 4 }}
