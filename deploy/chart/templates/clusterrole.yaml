{{- if .Values.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "skyops.fullname" . }}-role
  labels:
    {{- include "skyops.labels" . | nindent 4 }}
rules:
  # Core Workload API Resources (Strictly Read-Only)
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - nodes
      - services
      - endpoints
      - persistentvolumeclaims
      - persistentvolumes
    verbs: ["get", "list", "watch"]

  # ConfigMaps in Agent Namespace (For Cluster ID Persistence)
  - apiGroups: [""]
    resources:
      - configmaps
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Apps API Group (Read & Patch for Remediation)
  - apiGroups: ["apps"]
    resources:
      - deployments
      - deployments/scale
      - replicasets
      - statefulsets
      - statefulsets/scale
      - daemonsets
    verbs: ["get", "list", "watch", "update", "patch"]

  # Batch API Group (Read-Only)
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]

  # Storage API Group (Read-Only)
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
    verbs: ["get", "list", "watch"]

  # Discovery API Group (Read-Only)
  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs: ["get", "list", "watch"]
{{- end }}
