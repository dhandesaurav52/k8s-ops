{{- if .Values.postgresql.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "skyops.postgresql.fullname" . }}
  labels:
    app.kubernetes.io/component: database
    {{- include "skyops.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/component: database
    {{- include "skyops.selectorLabels" . | nindent 4 }}
{{- end }}
