apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: skyops-agent-binding
  labels:
    app.kubernetes.io/name: skyops-agent
subjects:
  - kind: ServiceAccount
    name: skyops-agent-sa
    namespace: skyops
roleRef:
  kind: ClusterRole
  name: skyops-agent-role
  apiGroup: rbac.authorization.k8s.io
